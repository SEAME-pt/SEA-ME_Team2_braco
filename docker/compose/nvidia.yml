# Optional override: NVIDIA GPU (OpenGL/Vulkan for Gazebo and RViz2) on the PC.
# Needs the NVIDIA driver and nvidia-container-toolkit on the host.
# Enable in .env:  COMPOSE_FILE=docker-compose.yml:compose/nvidia.yml  (or: make up GPU=nvidia)
services:
  pc-dev:
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      __GLX_VENDOR_LIBRARY_NAME: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
