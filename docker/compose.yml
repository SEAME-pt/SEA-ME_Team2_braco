# braco - SEA:ME 2.0 arm class (myCobot 280 Jetson Nano). Two containers on each machine:
#
#   dev    the tools: shell, colcon build/test, talker/listener. Same image as the system of that machine.
#          On the PC also the web page (make web).
#   real   the system on the Jetson (COMPOSE_PROFILES=jetson): the real arm and its ROS 2 nodes; make web adds the page
#   sim    the system on the PC     (COMPOSE_PROFILES=pc):     the simulated arm, Gazebo (make up SIM=1)
#
# COMPOSE_PROFILES in .env is the machine, exactly `pc` or `jetson`: it enables `real` or `sim` and picks the image
# of `dev` (braco-image/pc or braco-image/jetson). Run it through the root Makefile (make up, make down, ...), which builds the
# image and the workspace first. Needs Docker Engine 24+ and Docker Compose v2.20+.

name: braco

# ROS 2 networking. Every machine uses the same RMW. Domains (.env):
#   ROS_DOMAIN_ID     42  the real arm: `real` and the Jetson's `dev`
#   PC_ROS_DOMAIN_ID  77  the PC: `sim` and the PC's `dev` (make passes it as DEV_ROS_DOMAIN_ID). Never the real
#                         arm's: the simulation also publishes /joint_states. From the PC, reach the real arm with
#                         ROS_DOMAIN_ID=42 ros2 ... (the --real scripts use --real-domain 42 by themselves).
x-ros-env: &ros-env
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
  RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
  ROS_AUTOMATIC_DISCOVERY_RANGE: ${ROS_AUTOMATIC_DISCOVERY_RANGE:-SUBNET}
  # When multicast is blocked (campus Wi-Fi, some switches) add the other machine's IP:
  # ROS_STATIC_PEERS: "192.168.1.50"
  # Gazebo's own transport (gz-transport, not ROS) stays on this machine. With the host network it
  # otherwise picks a network interface by itself, and on some machines (VPN, several interfaces,
  # firewall) the Gazebo processes never find each other: ros_gz_sim waits forever on
  # "Requesting list of world names". Gazebo and ROS still talk through ros_gz_bridge.
  GZ_IP: ${GZ_IP:-127.0.0.1}

# Identical for both images on purpose: the shared `base` stage is then built once and reused.
x-build-args: &build-args
  UBUNTU_VERSION: "26.04"
  ROS_DISTRO: lyrical
  USER_UID: ${USER_UID:-1000}
  USER_GID: ${USER_GID:-1000}
  PYMYCOBOT_VERSION: ${PYMYCOBOT_VERSION:-}
  ROS_APT_SOURCE_VERSION: ${ROS_APT_SOURCE_VERSION:-1.3.0}

x-ros-common: &ros-common
  network_mode: host        # DDS discovery across machines needs the host network
  ipc: host                 # Fast DDS shared memory between containers on the same host
  init: true
  stdin_open: true
  tty: true
  restart: "no"             # a robot driver should not silently come back after a fault
  pull_policy: never        # images are built locally: without this, `up` first asks Docker Hub for
                            #   seame/<service> and prints "pull access denied" before building anyway
  working_dir: /ws
  cap_add:                  # effective for root/sudo inside the container; the unprivileged `dev` user
    - SYS_NICE              #   gets real-time scheduling (SCHED_FIFO for ros2_control's controller_manager
    - SYS_PTRACE            #   thread) from the rtprio/memlock ulimits below. SYS_PTRACE: gdb via sudo.
  ulimits:                  # if rootless Docker refuses these, delete this block
    rtprio: 99
    memlock: -1
  command: ["sleep", "infinity"]

# What `real` and `sim` share: the system runs its own entrypoint (no TTY) and must stop cleanly.
x-ros-system: &ros-system
  <<: *ros-common
  stdin_open: false
  tty: false
  stop_grace_period: 20s     # room for the launch (and a page started by make web) to shut down before Docker kills it

x-system-env: &system-env
  <<: *ros-env
  WEB_PORT: ${WEB_PORT:-8000}             # the braco page (make web): http://<machine>:8000
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}         # optional, for the Sprints page
  GITHUB_REPO: ${GITHUB_REPO:-SEAME-pt/SEA-ME_Team2_braco}

# The bind mounts of the system containers (dev lists its own, with comments).
x-volumes:
  - &vol-ws ../ros2_ws:/ws
  - &vol-repo ..:/opt/braco:ro             # the braco web page (web/) and the docs it shows
  - &vol-logs ros-logs:/home/dev/.ros

services:
  # ---------------------------------------------------------------------------------------
  # dev - the tools, on both machines (make shell, run, build, test, net-*). Never opens the arm's serial port:
  # that belongs to `real`. The image is the machine's: PC = RViz2, MoveIt 2, Gazebo, QA tools; Jetson = base.
  # PC: kept running. Jetson: never left running, the Makefile uses throw-away `docker compose run --rm dev ...`.
  # ---------------------------------------------------------------------------------------
  dev:
    <<: *ros-common
    image: ${IMAGE_PREFIX:-braco-image}/${COMPOSE_PROFILES:-pc}:${IMAGE_TAG:-lyrical}
    build:
      context: .
      target: ${COMPOSE_PROFILES:-pc}       # Dockerfile stages `pc` and `jetson`
      args: *build-args
    environment:
      <<: *system-env                       # ROS + the web page's settings: on the PC `make web` runs the page here
      ROS_DOMAIN_ID: ${DEV_ROS_DOMAIN_ID:-${ROS_DOMAIN_ID:-42}}   # the PC's domain on the PC (set by make)
      DISPLAY: ${DISPLAY:-:0}
      CCACHE_MAXSIZE: ${CCACHE_MAXSIZE:-1G}  # the Nano's SD card; colcon itself is limited by the Makefile
    volumes:
      - ../ros2_ws:/ws
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ccache:/home/dev/.ccache
      - gz-cache:/home/dev/.gz
      - ros-logs:/home/dev/.ros
      - ./tests:/opt/seame/tests:ro        # make net-test etc.; edit on the host, no rebuild
      - ..:/opt/braco:ro                   # the repository (web page and docs), as in the system containers

  # ---------------------------------------------------------------------------------------
  # real - the system on the Jetson: ONE container, everything under ROS 2 (make up). No build of its own: it uses
  # the image and the workspace that `dev` built. arm_routine.sh starts `ros2 launch braco_bringup braco.launch.py`:
  #   arm_driver           the ONLY process that opens the serial port; never moves the arm by
  #                        itself, so restarting it is safe
  #   temperature_monitor  servo temperatures -> /diagnostics + LCD1602
  #   joystick_teleop      joystick control; waits for the joystick and survives unplugging
  #   camera               the eye-in-hand USB camera -> /camera/image_raw/compressed; waits for it
  # The braco web page is not started with it: `make web` adds it (uvicorn on WEB_PORT, talks to the arm through ROS 2).
  # The arm is not moved when the container starts or stops: zero/park are manual (make zero / park, make down PARK=1).
  # ---------------------------------------------------------------------------------------
  real:
    <<: *ros-system
    profiles: [jetson]
    image: ${IMAGE_PREFIX:-braco-image}/jetson:${IMAGE_TAG:-lyrical}
    environment:
      <<: *system-env
      SIM: "false"
    command: ["/ws/install/braco_bringup/lib/braco_bringup/arm_routine.sh",
              "port:=${MYCOBOT_PORT:-/dev/ttyTHS1}", "baud:=${MYCOBOT_BAUD:-1000000}",
              "lcd_bus:=${LCD_I2C_BUS:-/dev/i2c-0}", "device:=${JOYSTICK_DEVICE:-/dev/input/js0}",
              "camera:=/run/hostdev/${CAMERA_DEVICE:-video0}"]
    group_add:
      - "${DIALOUT_GID:-20}"
      - "${I2C_GID:-65533}"                 # set by make setup; unset: unused placeholder (no LCD access; make doctor warns)
      - "${INPUT_GID:-65534}"               # set by make setup; unset: nogroup (no joystick access; make doctor warns)
      - "${VIDEO_GID:-44}"                  # the camera
    devices:
      - ${MYCOBOT_PORT:-/dev/ttyTHS1}:${MYCOBOT_PORT:-/dev/ttyTHS1}:rwm
      - ${LCD_I2C_BUS:-/dev/i2c-0}:${LCD_I2C_BUS:-/dev/i2c-0}:rw
      # Hardwired e-stop: if it reaches the Jetson through a GPIO line, expose the chip here
      # (the class README does not say how it is wired - confirm with the lab first):
      # - /dev/gpiochip0:/dev/gpiochip0
    # The whole /dev/input plus a cgroup rule for joystick/event devices (major 13), so the
    # controller can be plugged in after the container started, or unplugged and replugged.
    # The camera the same way (V4L2, major 81), but its node is directly in /dev: the host's /dev is mounted
    # at /run/hostdev, where the camera node opens it (CAMERA_DEVICE). The cgroup rules still decide which
    # devices can be opened, so this exposes nothing else.
    device_cgroup_rules:
      - "c 13:* rmw"
      - "c 81:* rmw"
    volumes:
      - *vol-ws
      - *vol-repo
      - *vol-logs
      - /dev/input:/dev/input
      - /dev:/run/hostdev

  # ---------------------------------------------------------------------------------------
  # sim - the system on the PC: the same launch with sim:=true (Gazebo, the braco_description model and the
  # ros2_control controllers, #34); `make web` runs the page in `dev` with ARM_SOURCE=gazebo. Uses the image and
  # the workspace that `dev` built.
  #   ROS_DOMAIN_ID  PC_ROS_DOMAIN_ID (default 77), like the PC's dev, NOT the real arm's 42: both publish
  #                  /joint_states, and on one domain the Jetson's clients would read the simulated angles as the
  #                  real arm's.
  #   GZ_PARTITION   keeps its Gazebo apart from one started by hand in `dev` (gazebo.launch.py)
  #   SIM_GUI=true   opens the Gazebo window (make up runs xhost +local:); default: headless (make sim-gui, or the page: make web)
  # ---------------------------------------------------------------------------------------
  sim:
    <<: *ros-system
    profiles: [pc]
    image: ${IMAGE_PREFIX:-braco-image}/pc:${IMAGE_TAG:-lyrical}
    environment:
      <<: *system-env
      ROS_DOMAIN_ID: ${PC_ROS_DOMAIN_ID:-77}
      GZ_PARTITION: braco-sim
      SIM: "true"
      DISPLAY: ${DISPLAY:-:0}
    command: ["/ws/install/braco_bringup/lib/braco_bringup/arm_routine.sh", "gui:=${SIM_GUI:-false}"]
    volumes:
      - *vol-ws
      - *vol-repo
      - *vol-logs
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - gz-cache:/home/dev/.gz

volumes:
  ccache:
  gz-cache:
  ros-logs:
