# SEA:ME 2.0 - Arm class (myCobot 280 Jetson Nano) - Sprint 0 + Module 1
#
#   PC / workstation (x86_64):  COMPOSE_PROFILES=pc      -> pc-dev
#   Jetson Nano (aarch64):      COMPOSE_PROFILES=jetson  -> jetson-driver
#
# Set the profile (and everything else) in .env - see .env.example.
# Needs Docker Engine 24+ and Docker Compose v2.20+.

name: seame-arm

# ROS 2 networking. Both machines MUST use the same domain and the same RMW.
x-ros-env: &ros-env
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
  RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
  ROS_AUTOMATIC_DISCOVERY_RANGE: ${ROS_AUTOMATIC_DISCOVERY_RANGE:-SUBNET}
  # When multicast is blocked (campus Wi-Fi, some switches) add the other machine's IP:
  # ROS_STATIC_PEERS: "192.168.1.50"

# Identical for both images on purpose: the shared `base` stage is then built once and reused.
x-build-args: &build-args
  UBUNTU_VERSION: "26.04"
  ROS_DISTRO: lyrical
  USER_UID: ${USER_UID:-1000}
  USER_GID: ${USER_GID:-1000}
  PYMYCOBOT_VERSION: ${PYMYCOBOT_VERSION:-}
  ROS_APT_SOURCE_VERSION: ${ROS_APT_SOURCE_VERSION:-1.3.0}

x-ros-common: &ros-common
  network_mode: host        # DDS discovery across machines needs the host network
  ipc: host                 # Fast DDS shared memory between containers on the same host
  init: true
  stdin_open: true
  tty: true
  restart: "no"             # a robot driver should not silently come back after a fault
  pull_policy: never        # images are built locally: without this, `up` first asks Docker Hub for
                            #   seame/<service> and prints "pull access denied" before building anyway
  working_dir: /ws
  cap_add:                  # effective for root/sudo inside the container; the unprivileged `dev` user
    - SYS_NICE              #   gets real-time scheduling (SCHED_FIFO for ros2_control's controller_manager
    - SYS_PTRACE            #   thread) from the rtprio/memlock ulimits below. SYS_PTRACE: gdb via sudo.
  ulimits:                  # if rootless Docker refuses these, delete this block
    rtprio: 99
    memlock: -1
  command: ["sleep", "infinity"]

services:
  # ---------------------------------------------------------------------------------------
  # PC: RViz2, MoveIt 2, Gazebo + ros2_control in simulation, CI-grade QA tooling
  # ---------------------------------------------------------------------------------------
  pc-dev:
    <<: *ros-common
    profiles: [pc]
    image: ${IMAGE_PREFIX:-seame}/pc-dev:${IMAGE_TAG:-lyrical}
    build:
      context: ./docker
      target: pc-dev
      args: *build-args
    environment:
      <<: *ros-env
      DISPLAY: ${DISPLAY:-:0}
    volumes:
      - ./ws:/ws
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ccache-pc:/home/dev/.ccache
      - gz-cache:/home/dev/.gz
      - ros-logs-pc:/home/dev/.ros
      - ./tests:/opt/seame/tests:ro        # `make talker-listener` etc.; edit on the host, no rebuild
      - ../web:/opt/seame/web:ro           # `make web-sim`: the web dashboard on top of Gazebo
      - ../libs:/opt/seame/libs:ro         # libs/cpp (mycobot_cpp); colcon finds it via make ws-build

  # ---------------------------------------------------------------------------------------
  # Jetson Nano: arm driver (pymycobot lifecycle node), ros2_control, controllers
  # ---------------------------------------------------------------------------------------
  jetson-driver:
    <<: *ros-common
    profiles: [jetson]
    image: ${IMAGE_PREFIX:-seame}/jetson-driver:${IMAGE_TAG:-lyrical}
    build:
      context: ./docker
      target: jetson-driver
      args: *build-args
    environment:
      <<: *ros-env
      MYCOBOT_PORT: ${MYCOBOT_PORT:-/dev/ttyTHS1}
      MYCOBOT_BAUD: ${MYCOBOT_BAUD:-1000000}
    group_add:
      - "${DIALOUT_GID:-20}"
    devices:
      - ${MYCOBOT_PORT:-/dev/ttyTHS1}:${MYCOBOT_PORT:-/dev/ttyTHS1}:rwm
      # Hardwired e-stop: if it reaches the Jetson through a GPIO line, expose the chip here
      # (the class README does not say how it is wired - confirm with the lab first):
      # - /dev/gpiochip0:/dev/gpiochip0
    volumes:
      - ./ws:/ws
      - ccache-jetson:/home/dev/.ccache
      - ros-logs-jetson:/home/dev/.ros
      - ./tests:/opt/seame/tests:ro        # `make talker-listener` etc.; edit on the host, no rebuild
      - ../libs:/opt/seame/libs:ro         # libs/cpp (mycobot_cpp); colcon finds it via make ws-build

  # ---------------------------------------------------------------------------------------
  # Jetson Nano: the always-on arm (profile "arm"): ONE container, everything runs under ROS 2.
  # Same image as jetson-driver, no build: build the workspace first (make ws-build ROLE=jetson),
  # then make arm-up. arm_routine.sh starts `ros2 launch seame_arm arm.launch.py`:
  #   arm_driver           the ONLY process that opens the serial port; never moves the arm by
  #                        itself, so restarting it is safe
  #   temperature_monitor  servo temperatures -> /diagnostics + LCD1602
  #   joystick_teleop      joystick control; waits for the joystick and survives unplugging
  # and around it: zero.py at start, park.py (fold + release the joints) when the container stops.
  # No restart policy: zero runs only on make arm-up / the seame-arm boot unit, so the arm
  # never re-zeroes by itself after a crash.
  # ---------------------------------------------------------------------------------------
  arm:
    <<: *ros-common
    profiles: [arm]
    image: ${IMAGE_PREFIX:-seame}/jetson-driver:${IMAGE_TAG:-lyrical}
    environment:
      <<: *ros-env
    stdin_open: false
    tty: false
    restart: "no"
    stop_grace_period: 60s   # room for park.py (up to 20 s of motion) before Docker kills it
    command: ["/ws/install/seame_arm/lib/seame_arm/arm_routine.sh",
              "port:=${MYCOBOT_PORT:-/dev/ttyTHS1}", "baud:=${MYCOBOT_BAUD:-1000000}",
              "lcd_bus:=${LCD_I2C_BUS:-/dev/i2c-0}", "device:=${JOYSTICK_DEVICE:-/dev/input/js0}"]
    group_add:
      - "${DIALOUT_GID:-20}"
      - "${I2C_GID:-${USER_GID:-1000}}"     # set by make env; fallback: your own group (harmless)
      - "${INPUT_GID:-${USER_GID:-1000}}"   # set by make env; fallback: your own group (harmless)
    devices:
      - ${MYCOBOT_PORT:-/dev/ttyTHS1}:${MYCOBOT_PORT:-/dev/ttyTHS1}:rwm
      - ${LCD_I2C_BUS:-/dev/i2c-0}:${LCD_I2C_BUS:-/dev/i2c-0}:rw
    # The whole /dev/input plus a cgroup rule for joystick/event devices (major 13), so the
    # controller can be plugged in after the container started, or unplugged and replugged.
    device_cgroup_rules:
      - "c 13:* rmw"
    volumes:
      - ./ws:/ws
      - ../libs:/opt/seame/libs:ro
      - ros-logs-arm:/home/dev/.ros
      - /dev/input:/dev/input

volumes:
  ccache-pc:
  ccache-jetson:
  gz-cache:
  ros-logs-pc:
  ros-logs-jetson:
  ros-logs-arm:
