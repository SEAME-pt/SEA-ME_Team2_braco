# The ros2_control controllers of the braco arm, for the simulation and the real arm.
#
#   joint_state_broadcaster       NOT ON THE REAL ARM: publishes /joint_states (joint1..joint6, radians).
#                                 Never spawned with sim:=false: there arm_driver is the only
#                                 /joint_states publisher (ADR-0004, #97)
#   arm_controller                holds joint1..joint6 and follows trajectories:
#                                   action /arm_controller/follow_joint_trajectory (MoveIt, planned)
#                                   topic  /arm_controller/joint_trajectory      (web page, by hand)
#   gripper_action_controller     SIMULATION ONLY (#123): opens and closes the gripper through its
#                                 master joint gripper_controller (the vendor's name), radians:
#                                 -0.74 closed .. 0.15 open. Gazebo moves the five mimic fingers.
#                                   action /gripper_action_controller/gripper_cmd (ParallelGripperCommand)
#                                 Needs gripper_actuated:=true (launch/gazebo.launch.py sets it); the
#                                 real driver has no gripper state yet, so the real arm keeps the
#                                 fingers fixed and never spawns it.
#
# Only the hardware under them changes, in the URDF's <ros2_control> block:
#   simulation  gz_ros2_control/GazeboSimSystem (urdf/braco.gazebo.xacro, gazebo:=true)   #34
#   real arm    planned: a braco SystemInterface over arm_driver (#87)
# so MoveIt, the mission and the page use the same arm_controller on both.
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_action_controller:
      type: parallel_gripper_action_controller/GripperActionController

arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

    # When a goal counts as reached (#123). Without these the controller ended every goal as
    # successful, even with the arm stopped on the table 0.33 rad short of the target.
    #   goal         after the trajectory, every joint within 0.07 rad (4 deg) of its last point,
    #                or the goal fails (GOAL_TOLERANCE_VIOLATED). Gazebo ends within 0.002 rad; the
    #                real servos stop up to ~3 deg short (dead zone, DEADBAND_DEG in
    #                scripts/braco_arm.py), so 0.07 keeps both successful. A goal blocked by the
    #                table ends 0.33 rad short and fails.
    #   trajectory   while moving, every joint within 0.3 rad of where it should be now, or the
    #                goal aborts (PATH_TOLERANCE_VIOLATED). Gazebo lags up to 0.047 rad behind at
    #                0.8 rad/s (about 60 ms); the real arm's lag is not measured yet (#87), so the
    #                margin is wide. A blocked arm then stops early, before the trajectory ends.
    #   goal_time    time after the trajectory's end to get within `goal`. Must be > 0: with 0 a
    #                blocked goal never ends. Kept at moveit_controllers.yaml's
    #                allowed_goal_duration_margin (0.5 s), so this controller, not MoveIt's
    #                timeout, reports the failure.
    #   stopped_velocity_tolerance  below this (rad/s) a joint counts as stopped at the end
    #                (the controller's default, written out).
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.5
      joint1: {trajectory: 0.3, goal: 0.07}
      joint2: {trajectory: 0.3, goal: 0.07}
      joint3: {trajectory: 0.3, goal: 0.07}
      joint4: {trajectory: 0.3, goal: 0.07}
      joint5: {trajectory: 0.3, goal: 0.07}
      joint6: {trajectory: 0.3, goal: 0.07}

gripper_action_controller:
  ros__parameters:
    joint: gripper_controller
    # A goal ends when the joint is within goal_tolerance of the command. A closing gripper that
    # stops on an object (stalls for stall_timeout) also ends the goal, as reached, not aborted.
    goal_tolerance: 0.01
    allow_stalling: true
    stall_timeout: 1.0
