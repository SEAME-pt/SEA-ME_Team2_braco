# Controllers for the Gazebo quick viewer (launch/gazebo.launch.py, urdf/braco.gazebo.xacro).
#
#   joint_state_broadcaster       publishes /joint_states from the simulated joints
#   arm_controller                holds joint1..joint6 and follows trajectories on
#                                 /arm_controller/joint_trajectory (the interface MoveIt uses)
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
