# CI for every PR and every push to main (issue #16). Both jobs call the Makefile, so a failure can be
# reproduced locally with the same command:
#
#   host  make ci        (host checks, lint, web page tests; no robot, no docker image)
#   ros   make ci-ros    (rosdep, colcon build, colcon test of ros2_ws/src + libs + examples)
#
# The Jetson (arm64) image is not built here: a QEMU build is too slow, use make jetson-image by hand.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a PR cancels its older run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  HADOLINT_VERSION: v2.12.0

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - id: py
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            web/requirements*.txt

      # make lint skips shellcheck and hadolint when they are missing, so install both to make the job mean something.
      - name: Install shellcheck and hadolint
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          sudo curl -fsSL -o /usr/local/bin/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          sudo chmod +x /usr/local/bin/hadolint
          shellcheck --version | head -n 2
          hadolint --version

      # Also creates docker/.env as every user gets it: lint validates the compose files against it.
      - name: make ci
        run: make ci PYTHON=${{ steps.py.outputs.python-path }}

  ros:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI_IMAGE: braco/ci:lyrical
    steps:
      - uses: actions/checkout@v5

      # The image's `dev` user gets the runner's UID/GID (1001 on GitHub), so the bind-mounted ros2_ws is writable.
      - id: ids
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Same image `make ci-ros` builds when it is missing, but with the BuildKit layers cached in GitHub's cache.
      - name: Build the CI image (Dockerfile stage base)
        uses: docker/build-push-action@v6
        with:
          context: docker
          target: base
          load: true
          tags: ${{ env.CI_IMAGE }}
          build-args: |
            USER_UID=${{ steps.ids.outputs.uid }}
            USER_GID=${{ steps.ids.outputs.gid }}
          cache-from: type=gha,scope=ci-base
          cache-to: type=gha,scope=ci-base,mode=max

      # ccache and colcon's build/ make warm runs incremental. The key changes with the image definition,
      # so a new toolchain never reuses an old CMake cache.
      - uses: actions/cache@v4
        with:
          path: |
            ros2_ws/.ccache
            ros2_ws/build
          key: colcon-${{ hashFiles('docker/Dockerfile', 'docker/config/**', 'docker/scripts/**') }}-${{ github.sha }}
          restore-keys: colcon-${{ hashFiles('docker/Dockerfile', 'docker/config/**', 'docker/scripts/**') }}-

      - name: make ci-ros
        run: make ci-ros CI_IMAGE=${{ env.CI_IMAGE }}
