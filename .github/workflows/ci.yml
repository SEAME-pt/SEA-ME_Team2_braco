# CI for every PR and every push to main (issue #16). Every job calls the Makefile, so a failure can be
# reproduced locally with the same command:
#
#   host  make ci        (lint, web page tests with coverage; no robot, no docker image)
#   ros   make ci-ros    (rosdep, colcon build, colcon test of ros2_ws/src)
#         make cppcheck  (cppcheck on the C++ packages, same image)
#         make tidy      (clang-tidy on the C++ packages, from the ci-ros build)
#   coverage  make coverage  (GoogleTests with gcovr, pytests with pytest-cov; same image as ros)
#
# The Jetson (arm64) image is not built here: a QEMU build is too slow, use make jetson-image by hand.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a PR cancels its older run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - id: py
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            web/requirements*.txt

      # shellcheck and hadolint need no install step: without a local binary, make lint runs the images pinned in
      # SHELLCHECK_IMAGE and HADOLINT_IMAGE (Makefile) through docker.

      # Also creates docker/.env as every user gets it: lint validates the compose files against it.
      - name: make ci
        run: make ci PYTHON=${{ steps.py.outputs.python-path }}

  ros:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI_IMAGE: braco-image/ci:lyrical
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The image's `dev` user gets the runner's UID/GID (1001 on GitHub), so the bind-mounted ros2_ws is writable.
      - id: ids
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Same image as `make ci-image` (keep target and build-args in step with CI_TARGET there), but with the
      # BuildKit layers cached in GitHub's cache between runs.
      - name: Build the CI image (Dockerfile stage base)
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: docker
          target: base
          load: true
          tags: ${{ env.CI_IMAGE }}
          build-args: |
            USER_UID=${{ steps.ids.outputs.uid }}
            USER_GID=${{ steps.ids.outputs.gid }}
          cache-from: type=gha,scope=ci-base
          cache-to: type=gha,scope=ci-base,mode=max

      # ccache and colcon's build/ make warm runs incremental. The key changes with the image definition,
      # so a new toolchain never reuses an old CMake cache.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ros2_ws/.ccache
            ros2_ws/build
          key: colcon-${{ hashFiles('docker/Dockerfile', 'docker/config/**', 'docker/scripts/**') }}-${{ github.sha }}
          restore-keys: colcon-${{ hashFiles('docker/Dockerfile', 'docker/config/**', 'docker/scripts/**') }}-

      - name: make ci-ros
        run: make ci-ros CI_IMAGE=${{ env.CI_IMAGE }}

      # JUnit XML of every gtest, pytest and linter, also (above all) when a test failed. ci-ros deletes the old
      # results first, so the cached build/ never adds those of a removed test.
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: test-results
          path: ros2_ws/build/*/test_results/
          if-no-files-found: warn
          retention-days: 14

      # Static analysis needs only the image, not the build: it also runs when a test failed, so one red step never
      # hides the other.
      - name: make cppcheck
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: make cppcheck CI_IMAGE=${{ env.CI_IMAGE }}

      # clang-tidy reads the compile_commands.json of make ci-ros's build, so it also runs when a test failed (the build
      # is there); after a failed build it stops at the missing database or reports the compile errors.
      - name: make tidy
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: make tidy CI_IMAGE=${{ env.CI_IMAGE }}

  # A Debug build with --coverage in ros2_ws/coverage/, which shares nothing with ros's build/: as its own job it runs
  # alongside ros instead of after it, and a branch protection rule can require it by name.
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI_IMAGE: braco-image/ci:lyrical
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - id: ids
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # The ros job's image and layer cache. Only ros writes the cache back: two jobs exporting the same scope at
      # the same time would only race to store the same layers.
      - name: Build the CI image (Dockerfile stage base)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: docker
          target: base
          load: true
          tags: ${{ env.CI_IMAGE }}
          build-args: |
            USER_UID=${{ steps.ids.outputs.uid }}
            USER_GID=${{ steps.ids.outputs.gid }}
          cache-from: type=gha,scope=ci-base

      # Its own ccache: the --coverage objects never match ros's. The build tree is not cached; make coverage
      # deletes the old counters, but a fresh tree is the simpler guarantee.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ros2_ws/.ccache
          key: coverage-${{ hashFiles('docker/Dockerfile', 'docker/config/**', 'docker/scripts/**') }}-${{ github.sha }}
          restore-keys: coverage-${{ hashFiles('docker/Dockerfile', 'docker/config/**', 'docker/scripts/**') }}-

      - name: make coverage
        run: make coverage CI_IMAGE=${{ env.CI_IMAGE }}

      # gcovr's HTML report, per file and line. Also uploaded when a test failed, if gcovr got that far.
      - name: Upload the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: coverage
          path: ros2_ws/coverage/html/
          if-no-files-found: warn
          retention-days: 14
