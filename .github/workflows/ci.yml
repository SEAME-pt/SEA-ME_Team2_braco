# CI for every PR and every push to main (issue #16). Every job calls the Makefile, so a failure can be
# reproduced locally with the same command. A PR or push to main that changes nothing ros and coverage read (docs,
# compose files, web/, templates; see the changes job) skips them, and one with no C++ input skips make tidy; host
# always runs.
#
#   host  make ci        (lint, web page tests with coverage; no robot, no docker image)
#   ros   make ci-ros    (rosdep, colcon build, colcon test of ros2_ws/src)
#         make cppcheck  (cppcheck on the C++ packages, same image)
#         make tidy      (clang-tidy on the C++ packages, from the ci-ros build)
#   coverage  make coverage  (GoogleTests with gcovr, pytests with pytest-cov; same image as ros)
#
# The Jetson (arm64) image is not built here: a QEMU build is too slow, use make jetson-image by hand.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a PR cancels its older run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Decides from git diff which heavy work a change needs. Both outputs are false only when no changed file is an
  # input of that work; a skipped job counts as passed for a required check.
  #   code  ros and coverage: what they read (see ros_input below). The container mounts only ros2_ws/, the image is
  #         built from docker/Dockerfile, config/ and scripts/, coverage mounts scripts/, and every job runs make.
  #         Docs, compose files, web/ and the like are checked by host alone.
  #   cpp   make tidy, a subset of code (see tidy_input): the C++ sources and what reaches their compile commands.
  # A PR diffs its base...head, a push to main diffs before..sha (everything the push brought, a merge included).
  # Manual runs, a push with no `before` (all zeros) and a failed diff run everything; if this job fails, both outputs
  # are empty and everything runs anyway. --no-renames lists both paths of a rename, so moving code into docs/ still
  # builds. host is never skipped: it takes under a minute.
  # A skipped ros on main saves no cache: the next run restores the last one by prefix (restore-keys), built from the
  # same inputs, since a file outside ros_input never reaches the build.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      cpp: ${{ steps.diff.outputs.cpp }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: github.event_name != 'workflow_dispatch'
        with:
          fetch-depth: 0

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          # A new folder that ros or coverage reads (a mount in mk/ci.mk, a COPY in the Dockerfile) goes here too,
          # or a change to it would skip the jobs that test it.
          ros_input() {
            case "$1" in
              *.md) return 1 ;;
              ros2_ws/* | docker/Dockerfile | docker/config/* | docker/scripts/* | scripts/*) return 0 ;;
              Makefile | mk/* | .github/workflows/*) return 0 ;;
              *) return 1 ;;
            esac
          }
          # The image (clang-tidy and the ROS headers), the make target and the workflow, then in ros2_ws/src: the
          # sources, the CMake and package files that set their flags and dependencies, the interfaces whose
          # generated headers they include, and the .clang-tidy files.
          tidy_input() {
            case "$1" in
              docker/Dockerfile | docker/config/* | docker/scripts/* | Makefile | mk/ci.mk | .github/workflows/*) return 0 ;;
              ros2_ws/*.cpp | ros2_ws/*.cc | ros2_ws/*.hpp | ros2_ws/*.h) return 0 ;;
              ros2_ws/*/CMakeLists.txt | ros2_ws/*/package.xml | ros2_ws/*/.clang-tidy | ros2_ws/.clang-tidy) return 0 ;;
              ros2_ws/*.msg | ros2_ws/*.srv | ros2_ws/*.action) return 0 ;;
              *) return 1 ;;
            esac
          }

          case "$EVENT" in
            pull_request) range="$PR_BASE...$PR_HEAD" ;;
            push) range="$PUSH_BEFORE..$PUSH_AFTER" ;;
            *) range= ;;
          esac
          if [ "$PUSH_BEFORE" = 0000000000000000000000000000000000000000 ]; then range=; fi

          code=true
          cpp=true
          if [ -n "$range" ] && files=$(git diff --name-only --no-renames "$range") && [ -n "$files" ]; then
            printf '%s\n' "$files"
            code=false
            cpp=false
            while IFS= read -r f; do
              if [ "$code" = false ] && ros_input "$f"; then echo "code: $f"; code=true; fi
              if [ "$cpp" = false ] && tidy_input "$f"; then echo "cpp: $f"; cpp=true; fi
            done <<< "$files"
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"
          echo "cpp=$cpp" | tee -a "$GITHUB_OUTPUT"

  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - id: py
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            web/requirements*.txt

      # shellcheck and hadolint need no install step: without a local binary, make lint runs the images pinned in
      # SHELLCHECK_IMAGE and HADOLINT_IMAGE (Makefile) through docker.

      # make ci, one step per part so the failing one is named; each runs even when an earlier one failed. The first
      # creates .venv with this Python, the others reuse it.
      - name: make format-check
        run: make format-check PYTHON=${{ steps.py.outputs.python-path }}

      # Also creates docker/.env as every user gets it: lint validates the compose files against it.
      - name: make lint
        if: ${{ !cancelled() }}
        run: make lint PYTHON=${{ steps.py.outputs.python-path }}

      - name: make web-test
        if: ${{ !cancelled() }}
        run: make web-test PYTHON=${{ steps.py.outputs.python-path }}

      - name: make timing-test
        if: ${{ !cancelled() }}
        run: make timing-test PYTHON=${{ steps.py.outputs.python-path }}

  ros:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI_IMAGE: braco-image/ci:lyrical
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The image's `dev` user gets the runner's UID/GID (1001 on GitHub), so the bind-mounted ros2_ws is writable.
      - id: ids
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Same image as `make ci-image` (keep target and build-args in step with CI_TARGET there), but with the
      # BuildKit layers cached in GitHub's cache between runs. Only pushes to main export them: a PR can read main's
      # cache but no other PR's, so PR exports only filled the 10 GB repo cache and evicted main's. A PR that changes
      # the Dockerfile rebuilds its changed layers on each push until it merges.
      - name: Build the CI image (Dockerfile stage ci)
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: docker
          target: ci
          load: true
          tags: ${{ env.CI_IMAGE }}
          build-args: |
            USER_UID=${{ steps.ids.outputs.uid }}
            USER_GID=${{ steps.ids.outputs.gid }}
          cache-from: type=gha,scope=ci-base
          cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=ci-base,mode=max' || '' }}

      # ccache and colcon's build/ make warm runs incremental. The key changes with the image definition,
      # so a new toolchain never reuses an old CMake cache. Restored on every run, saved (last step) only on pushes to
      # main, for the same reason as the image layers.
      - id: colcon-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ros2_ws/.ccache
            ros2_ws/build
          key: colcon-${{ hashFiles('docker/Dockerfile', 'docker/config/**', 'docker/scripts/**') }}-${{ github.sha }}
          restore-keys: colcon-${{ hashFiles('docker/Dockerfile', 'docker/config/**', 'docker/scripts/**') }}-

      - name: make ci-ros
        run: make ci-ros CI_IMAGE=${{ env.CI_IMAGE }}

      # JUnit XML of every gtest, pytest and linter, also (above all) when a test failed. ci-ros deletes the old
      # results first, so the cached build/ never adds those of a removed test.
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: test-results
          path: ros2_ws/build/*/test_results/
          if-no-files-found: warn
          retention-days: 14

      # Static analysis needs only the image, not the build: it also runs when a test failed, so one red step never
      # hides the other.
      - name: make cppcheck
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: make cppcheck CI_IMAGE=${{ env.CI_IMAGE }}

      # clang-tidy reads the compile_commands.json of make ci-ros's build, so it also runs when a test failed (the build
      # is there); after a failed build it stops at the missing database or reports the compile errors. Skipped when the
      # change has no C++ input (changes job, output cpp).
      # ctcache keeps one entry per file that passed, keyed on its preprocessed source (comments kept, so removing a
      # NOLINT re-checks it), its clang-tidy config and arguments: only the files a change reaches are analysed again.
      # The key here adds the image definition (the clang-tidy version is not in ctcache's). Saved only on pushes to
      # main, like the colcon cache, and only after a passing tidy; a failure is never cached.
      - id: tidy-cache
        if: ${{ !cancelled() && steps.image.outcome == 'success' && needs.changes.outputs.cpp != 'false' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ros2_ws/.ctcache
          key: ctcache-${{ hashFiles('docker/Dockerfile', 'docker/config/**', 'docker/scripts/**') }}-${{ github.sha }}
          restore-keys: ctcache-${{ hashFiles('docker/Dockerfile', 'docker/config/**', 'docker/scripts/**') }}-

      - name: make tidy
        id: tidy
        if: ${{ !cancelled() && steps.image.outcome == 'success' && needs.changes.outputs.cpp != 'false' }}
        run: make tidy CI_IMAGE=${{ env.CI_IMAGE }}

      - name: Save the clang-tidy cache
        if: github.event_name == 'push' && steps.tidy.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ros2_ws/.ctcache
          key: ${{ steps.tidy-cache.outputs.cache-primary-key }}

      # Only when every step passed, as actions/cache did: a failed build is never the next run's starting point.
      - name: Save the colcon cache
        if: github.event_name == 'push'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ros2_ws/.ccache
            ros2_ws/build
          key: ${{ steps.colcon-cache.outputs.cache-primary-key }}

  # A Debug build with --coverage in ros2_ws/coverage/, which shares nothing with ros's build/: as its own job it runs
  # alongside ros instead of after it, and a branch protection rule can require it by name.
  coverage:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI_IMAGE: braco-image/ci:lyrical
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - id: ids
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # The ros job's image and layer cache. Only ros writes the cache back: two jobs exporting the same scope at
      # the same time would only race to store the same layers.
      - name: Build the CI image (Dockerfile stage ci)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: docker
          target: ci
          load: true
          tags: ${{ env.CI_IMAGE }}
          build-args: |
            USER_UID=${{ steps.ids.outputs.uid }}
            USER_GID=${{ steps.ids.outputs.gid }}
          cache-from: type=gha,scope=ci-base

      # Its own ccache: the --coverage objects never match ros's. The build tree is not cached; make coverage
      # deletes the old counters, but a fresh tree is the simpler guarantee. Saved only on pushes to main, like ros's.
      - id: coverage-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ros2_ws/.ccache
          key: coverage-${{ hashFiles('docker/Dockerfile', 'docker/config/**', 'docker/scripts/**') }}-${{ github.sha }}
          restore-keys: coverage-${{ hashFiles('docker/Dockerfile', 'docker/config/**', 'docker/scripts/**') }}-

      - name: make coverage
        run: make coverage CI_IMAGE=${{ env.CI_IMAGE }}

      # gcovr's HTML report, per file and line. Also uploaded when a test failed, if gcovr got that far.
      - name: Upload the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: coverage
          path: ros2_ws/coverage/html/
          if-no-files-found: warn
          retention-days: 14

      - name: Save the coverage ccache
        if: github.event_name == 'push'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ros2_ws/.ccache
          key: ${{ steps.coverage-cache.outputs.cache-primary-key }}
